[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Function routes come from each handler export const config.path.
# Do not shadow them with /.netlify/functions redirects (breaks Functions v2).
# SPA fallback is last; Netlify serves function paths first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
